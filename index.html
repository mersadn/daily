<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه هفتگی من</title>
<meta name="theme-color" content="#6C5CE7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="برنامه هفتگی">
<style>
  :root{
    --purple:#6C5CE7;
    --purple-dark:#2D2A6E;
    --bg:#F4F3FB;
    --card:#FFFFFF;
    --text:#2B2B33;
    --muted:#8A88A3;
    --done:#B8B6D6;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  header{
    background:linear-gradient(135deg,var(--purple),var(--purple-dark));
    color:#fff;
    padding:20px 16px 14px;
    padding-top:calc(20px + env(safe-area-inset-top));
    border-radius:0 0 22px 22px;
    box-shadow:0 4px 14px rgba(45,42,110,.25);
  }
  header h1{margin:0 0 4px;font-size:20px;}
  header p{margin:0;font-size:13px;opacity:.85;}

  .days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 16px 4px;
    scrollbar-width:none;
  }
  .days::-webkit-scrollbar{display:none;}
  .day-pill{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:14px;
    background:var(--card);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:1px solid #EBEAF6;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:52px;
    transition:.15s;
  }
  .day-pill small{font-weight:400;font-size:10px;margin-top:2px;}
  .day-pill.active{
    background:var(--purple);
    color:#fff;
    border-color:var(--purple);
    transform:translateY(-2px);
  }
  .day-pill.today:not(.active){border-color:var(--purple);color:var(--purple);}

  main{padding:12px 16px 90px;}

  .add-box{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .add-box input[type=text]{
    flex:1;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid #E4E2F3;
    background:var(--card);
    font-size:14px;
    outline:none;
  }
  .add-box input[type=time]{
    width:92px;
    padding:12px 8px;
    border-radius:14px;
    border:1px solid #E4E2F3;
    background:var(--card);
    font-size:13px;
    outline:none;
  }
  .add-box button{
    width:46px;
    border:none;
    border-radius:14px;
    background:var(--purple);
    color:#fff;
    font-size:22px;
    cursor:pointer;
  }

  .task{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:9px;
    box-shadow:0 1px 4px rgba(45,42,110,.06);
  }
  .task .time{
    font-size:11px;
    color:var(--purple);
    background:#EFEDFB;
    padding:3px 7px;
    border-radius:8px;
    min-width:44px;
    text-align:center;
    flex:0 0 auto;
  }
  .task .check{
    width:22px;height:22px;border-radius:50%;
    border:2px solid #D6D4EC;
    flex:0 0 auto;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:13px;
  }
  .task.done .check{background:var(--purple);border-color:var(--purple);}
  .task .txt{flex:1;font-size:14.5px;word-break:break-word;}
  .task.done .txt{color:var(--done);text-decoration:line-through;}
  .task .del{
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    padding:2px 4px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:40px 10px;
  }

  .notes{
    margin-top:18px;
  }
  .notes h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600;}
  .notes textarea{
    width:100%;
    min-height:70px;
    border-radius:14px;
    border:1px solid #E4E2F3;
    background:var(--card);
    padding:12px;
    font-size:13.5px;
    font-family:inherit;
    resize:vertical;
    outline:none;
  }

  .install-banner{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--purple-dark);
    color:#fff;
    padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    display:none;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    gap:10px;
  }
  .install-banner.show{display:flex;}
  .install-banner button{
    background:#fff;
    color:var(--purple-dark);
    border:none;
    padding:8px 14px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>📅 برنامه هفتگی من</h1>
  <p id="todayLabel"></p>
</header>

<div class="days" id="days"></div>

<main>
  <div class="add-box">
    <input type="time" id="taskTime">
    <input type="text" id="taskInput" placeholder="کار جدید...">
    <button id="addBtn">+</button>
  </div>

  <div id="taskList"></div>

  <div class="notes">
    <h3>یادداشت این روز</h3>
    <textarea id="noteBox" placeholder="یادداشت آزاد..."></textarea>
  </div>
</main>

<div class="install-banner" id="installBanner">
  <span>این برنامه رو نصب کن روی گوشیت 📲</span>
  <button id="installBtn">نصب</button>
</div>

<script>
const DAYS = [
  {key:'sat', label:'شنبه'},
  {key:'sun', label:'یک‌شنبه'},
  {key:'mon', label:'دوشنبه'},
  {key:'tue', label:'سه‌شنبه'},
  {key:'wed', label:'چهارشنبه'},
  {key:'thu', label:'پنج‌شنبه'},
  {key:'fri', label:'جمعه'},
];
// JS getDay(): 0=Sun...6=Sat -> map to our keys where 0=sat
const JS_TO_KEY = ['sun','mon','tue','wed','thu','fri','sat'];
const todayKey = JS_TO_KEY[new Date().getDay()];

let activeDay = todayKey;

const STORE_KEY = 'weekly-planner-data-v1';

function loadData(){
  try{
    return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
  }catch(e){ return {}; }
}
function saveData(data){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
let data = loadData();
DAYS.forEach(d=>{
  if(!data[d.key]) data[d.key] = {tasks:[], note:''};
});

function renderDays(){
  const wrap = document.getElementById('days');
  wrap.innerHTML = '';
  DAYS.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'day-pill' + (d.key===activeDay?' active':'') + (d.key===todayKey?' today':'');
    el.innerHTML = d.label + (d.key===todayKey?'<small>امروز</small>':'');
    el.onclick = ()=>{ activeDay = d.key; renderAll(); };
    wrap.appendChild(el);
  });
}

function renderTasks(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const tasks = data[activeDay].tasks;
  if(tasks.length===0){
    list.innerHTML = '<div class="empty">کاری برای این روز ثبت نشده</div>';
    return;
  }
  const sorted = [...tasks].sort((a,b)=>{
    if(!a.time) return 1;
    if(!b.time) return -1;
    return a.time.localeCompare(b.time);
  });
  sorted.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'task' + (t.done?' done':'');
    row.innerHTML = `
      ${t.time ? `<div class="time">${t.time}</div>` : ''}
      <div class="check">${t.done?'✓':''}</div>
      <div class="txt">${escapeHtml(t.text)}</div>
      <div class="del">✕</div>
    `;
    row.querySelector('.check').onclick = ()=>{
      t.done = !t.done;
      saveData(data);
      renderTasks();
    };
    row.querySelector('.del').onclick = ()=>{
      data[activeDay].tasks = data[activeDay].tasks.filter(x=>x.id!==t.id);
      saveData(data);
      renderTasks();
    };
    list.appendChild(row);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderNote(){
  document.getElementById('noteBox').value = data[activeDay].note || '';
}

function renderTodayLabel(){
  const dayObj = DAYS.find(d=>d.key===todayKey);
  const now = new Date();
  const dateStr = now.toLocaleDateString('fa-IR');
  document.getElementById('todayLabel').textContent = `امروز ${dayObj.label} - ${dateStr}`;
}

function renderAll(){
  renderDays();
  renderTasks();
  renderNote();
}

document.getElementById('addBtn').onclick = ()=>{
  const input = document.getElementById('taskInput');
  const timeInput = document.getElementById('taskTime');
  const text = input.value.trim();
  if(!text) return;
  data[activeDay].tasks.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2),
    text,
    time: timeInput.value || '',
    done:false
  });
  saveData(data);
  input.value='';
  timeInput.value='';
  renderTasks();
};

document.getElementById('taskInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('addBtn').click();
});

let noteTimer;
document.getElementById('noteBox').addEventListener('input', e=>{
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{
    data[activeDay].note = e.target.value;
    saveData(data);
  }, 300);
});

renderTodayLabel();
renderAll();

// --- PWA install prompt ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').onclick = async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
};
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBanner').classList.remove('show');
});

// --- Service worker ---
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
